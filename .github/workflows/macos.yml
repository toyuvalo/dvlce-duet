# macOS build (universal AU + VST3 + Standalone) on a GitHub runner.  On a published release it
# validates the plugin and attaches Dvlce-Duet-<version>-macOS.zip to that release.
name: macos

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: JOBS=3 sh ./build-mac.sh

      - name: Presets and snapshots
        run: |
          ./build/plugin/DvlceDuetPresetTest
          mkdir -p snapshots
          ./build/plugin/DvlceDuetSnapshot snapshots/editor.png 0 1000 620
          ./build/plugin/DvlceDuetSnapshot snapshots/editor-alternate.png 1 1000 620

      - uses: actions/upload-artifact@v4
        with:
          name: macos-snapshots
          path: snapshots/*.png
          if-no-files-found: error

      - name: Ad-hoc sign the bundles
        run: |
          A="build/plugin/DvlceDuet_artefacts/Release"
          for b in "$A/AU/Dvlce Duet.component" "$A/VST3/Dvlce Duet.vst3" "$A/Standalone/Dvlce Duet.app"; do
            codesign --force --deep -s - "$b"
          done

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/plugin/DvlceDuet_artefacts/Release/AU/Dvlce Duet.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx Duet Dvlc

      - name: pluginval (VST3 + AU, strictness 10)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pv.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build/plugin/DvlceDuet_artefacts/Release/VST3/Dvlce Duet.vst3"
          $PV --strictness-level 10 --skip-gui-tests --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/"Dvlce Duet.component"

      - name: Zip
        run: |
          V=$(cat VERSION | tr -d '\r')
          D="Dvlce-Duet-$V-macOS"
          A="build/plugin/DvlceDuet_artefacts/Release"
          mkdir "$D"
          cp -R "$A/AU/Dvlce Duet.component" "$A/VST3/Dvlce Duet.vst3" "$A/Standalone/Dvlce Duet.app" "$D/"
          cp LICENSE COMMERCIAL.md README.md "$D/"
          ditto -c -k --keepParent "$D" "$D.zip"
          lipo -info "$D/Dvlce Duet.vst3/Contents/MacOS/Dvlce Duet"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: Dvlce-Duet-*-macOS.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Dvlce-Duet-*-macOS.zip --clobber
